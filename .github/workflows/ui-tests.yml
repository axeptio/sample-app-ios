name: UI Tests

# Runs the sampleSwiftUITests XCUITest suite against the sampleSwift app.
# Runs nightly (and on manual dispatch), not as a PR gate: the suite drives the
# live Axeptio consent webview over the network and takes ~30 min, which is too
# slow/flaky to block PRs.
# Kept fully inline (no reusable workflow): this repo is public and cannot call
# Axeptio's internal/private reusable workflows.

on:
  schedule:
    - cron: '0 3 * * *' # nightly at 03:00 UTC, on the default branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    # No device in the name: the runner's simulator set rotates, and the one actually used is
    # logged by the Select a simulator step.
    name: XCUITest
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Resolve Swift packages
        working-directory: sampleSwift
        run: xcodebuild -resolvePackageDependencies -project sampleSwift.xcodeproj -scheme sampleSwift

      # Resolve the device instead of naming it. Pinning 'iPhone 16' silently stopped working
      # when GitHub rotated the runner image to the iPhone 17 family: every run failed in ~2
      # minutes on destination resolution, before building anything.
      - name: Select a simulator
        id: sim
        run: |
          set -euo pipefail
          # Fail the job here rather than handing xcodebuild an empty destination, which
          # would produce a far less obvious error further down.
          udid=$(scripts/pick-simulator.sh)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run UI tests
        working-directory: sampleSwift
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcodebuild test \
            -project sampleSwift.xcodeproj \
            -scheme sampleSwift \
            -destination "id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            -only-testing:sampleSwiftUITests \
            -retry-tests-on-failure \
            -test-iterations 3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-results
          path: sampleSwift/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
