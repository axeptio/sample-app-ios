name: Release

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Import bot GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true
          git_committer_name: axeptio-bot
          git_committer_email: ${{ secrets.BOT_EMAIL }}

      - name: Authenticate git remote as axeptio-bot
        run: git remote set-url origin "https://x-access-token:${BOT_GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          # @semantic-release/git hardcodes its own commit identity
          # (semantic-release-bot@martynus.net) via these env vars unless
          # they're already set — global git config alone doesn't override
          # it, which is what left the release commit unverified.
          GIT_AUTHOR_NAME: axeptio-bot
          GIT_AUTHOR_EMAIL: ${{ secrets.BOT_EMAIL }}
          GIT_COMMITTER_NAME: axeptio-bot
          GIT_COMMITTER_EMAIL: ${{ secrets.BOT_EMAIL }}
